name: Build Neway OpenPnP ISO

on:
  push:
    branches:
      - "feat/custom-openpnp-jar-input"
  pull_request:
    paths:
      - ".github/workflows/build-iso.yml"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neway-openpnp-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate scripts and configuration
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          bash -n scripts/build-iso.sh scripts/validate-config.sh tests/*.sh
          shellcheck scripts/build-iso.sh scripts/validate-config.sh tests/*.sh
          bash scripts/validate-config.sh

      - name: Build ISO with pinned Neway custom OpenPnP release
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie \
            bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common syslinux-utils grub-efi-amd64-bin \
                mtools dosfstools ca-certificates curl unzip openjdk-21-jre-headless \
                shellcheck file
              bash scripts/validate-config.sh
              bash scripts/build-iso.sh
              file build-output/neway-pnp-os-amd64.iso
              (cd build-output && sha256sum --check SHA256SUMS)
            '

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: neway-pnp-os-amd64-${{ github.sha }}
          path: |
            build-output/neway-pnp-os-amd64.iso
            build-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
