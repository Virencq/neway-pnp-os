name: Build Neway PnP OS ISO

on:
  pull_request:
    paths:
      - ".github/workflows/build-iso.yml"
      - ".devcontainer/**"
      - "config/**"
      - "scripts/**"
      - "docs/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build amd64 Debian Trixie live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Neway PnP OS
        uses: actions/checkout@v4

      - name: Install host validation and container tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          docker --version

      - name: Validate repository scripts and configuration
        run: |
          bash -n scripts/build-iso.sh scripts/validate-config.sh
          shellcheck scripts/build-iso.sh scripts/validate-config.sh
          bash scripts/validate-config.sh

      - name: Build ISO inside Debian Trixie
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            debian:trixie \
            bash -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates
              bash scripts/validate-config.sh
              bash scripts/build-iso.sh
            '

      - name: Verify ISO and checksum
        run: |
          test -s build-output/neway-pnp-os-amd64.iso
          file build-output/neway-pnp-os-amd64.iso
          (cd build-output && sha256sum --check SHA256SUMS)

      - name: Upload ISO and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: neway-pnp-os-amd64-${{ github.sha }}
          path: |
            build-output/neway-pnp-os-amd64.iso
            build-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
