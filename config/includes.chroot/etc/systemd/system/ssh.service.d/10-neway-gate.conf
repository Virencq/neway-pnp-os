[Unit]
ConditionPathExists=/etc/neway/maintenance-enabled
ConditionPathExists=/etc/wireguard/wg0.conf
ConditionPathExists=/var/lib/neway/identity/controller-attestation.verified

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
ExecStartPre=/usr/local/sbin/neway-remote-maintenance-guard
